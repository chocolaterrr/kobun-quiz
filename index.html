<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>古典文法 助動詞クイズ</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f7fa; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { text-align: center; font-size: 1.4rem; color: #2c3e50; margin-bottom: 20px; }
        .btn-refresh { display: block; width: 100%; background: #3498db; color: #fff; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; margin-bottom: 20px; transition: background 0.2s; }
        .btn-refresh:active { background: #2980b9; }
        .quiz-row { display: flex; align-items: center; background: #fff; border: 1px solid #e1e8ed; border-radius: 8px; margin-bottom: 10px; padding: 10px; transition: all 0.2s; }
        .question { font-size: 1.2rem; font-weight: bold; width: 80px; flex-shrink: 0; color: #2c3e50; text-align: center; }
        .answers { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding-left: 10px; border-left: 2px solid #e1e8ed; }
        .answer-item { font-size: 0.9rem; color: #7f8c8d; display: none; }
        .answer-item span { color: #333; font-weight: 500; }
        .quiz-row.show .answer-item { display: block; }
        .toggle-btn { background: #fff; border: 2px solid #bdc3c7; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; color: #bdc3c7; }
        .quiz-row.show .toggle-btn { border-color: #2ecc71; color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 古典助動詞クイズ (15問)</h1>
    <button class="btn-refresh" onclick="generateQuiz()">🔄 次の15問へ（シャッフル）</button>
    <div id="quiz-list"></div>
</div>

<script>
    // やうなりを削除した最新の27個のデータ
    const dataList = [
        {word:"る", mean:"受身・尊敬・可能・自発", conn:"未然形", form:"れ・れ・る・るる・るれ・れよ"},
        {word:"らる", mean:"受身・尊敬・可能・自発", conn:"未然形", form:"られ・られ・らる・らるる・らるれ・られよ"},
        {word:"す", mean:"使役・尊敬", conn:"未然形", form:"せ・せ・す・する・すれ・せよ"},
        {word:"さす", mean:"使役・尊敬", conn:"未然形", form:"させ・させ・さす・さする・さすれ・させよ"},
        {word:"しむ", mean:"使役・尊敬", conn:"未然形", form:"しめ・しめ・しむ・しむる・しむれ・しめよ"},
        {word:"ず", mean:"打消", conn:"未然形", form:"（ず・ず・ず・ぬ・ね・〇）/（ざら・ざり・〇・ざる・ざれ・ざれ）"},
        {word:"き", mean:"過去", conn:"連用形", form:"せ・〇・き・し・しか・〇"},
        {word:"けり", mean:"過去・詠嘆", conn:"連用形", form:"けら・〇・けり・ける・けれ・〇"},
        {word:"つ", mean:"完了・強意・並列", conn:"連用形", form:"て・て・つ・つる・つれ・てよ"},
        {word:"ぬ", mean:"完了・強意・並列", conn:"連用形", form:"な・に・ぬ・ぬる・ぬれ・ね"},
        {word:"たり(過)", mean:"存続・完了", conn:"連用形", form:"たら・たり・たり・たる・たれ・たれ"},
        {word:"り", mean:"存続・完了", conn:"サ変の未然/四段の已然", form:"ら・り・り・る・れ・れ"},
        {word:"む", mean:"推量・意志・勧誘・仮定・婉曲", conn:"未然形", form:"〇・〇・む・む・め・〇"},
        {word:"むず", mean:"推量・意志・勧誘・仮定・婉曲", conn:"未然形", form:"〇・〇・むず・むずる・むづれ・〇"},
        {word:"らむ", mean:"現在推量・原因推量・伝聞・婉曲", conn:"終止形(ラ変は連体)", form:"〇・〇・らむ・らむ・らめ・〇"},
        {word:"けむ", mean:"過去推量・過去の原因・伝聞・婉曲", conn:"連用形", form:"〇・〇・けむ・けむ・けめ・〇"},
        {word:"まし", mean:"反実仮想・実現不可能な希望・ためらい", conn:"未然形", form:"ましか(ませ)・〇・まし・まし・ましか・〇"},
        {word:"まほし", mean:"希望（自己）", conn:"未然形", form:"(まほしから・まほしかり・〇…)/(〇・まほしく…)"},
        {word:"べし", mean:"推量・意志・可能・当然・命令・適当", conn:"終止形(ラ変は連体)", form:"(べから・べかり・〇…)/(べく・べう…)"},
        {word:"らし", mean:"推定（客観的根拠）", conn:"終止形(ラ変は連体)", form:"〇・〇・らし・らし・らし・〇"},
        {word:"めり", mean:"推定（視覚的）・婉曲", conn:"終止形(ラ変は連体)", form:"〇・めり・めり・める・めれ・〇"},
        {word:"なり(推)", mean:"推定（聴覚的）・伝聞", conn:"終止形(ラ変は連体)", form:"〇・なり・なり・なる・なれ・〇"},
        {word:"なり(断)", mean:"断定・存在", conn:"体言・連体形", form:"なら・なり（に）・なり・なる・なれ・なれ"},
        {word:"たり(断)", mean:"断定", conn:"体言", form:"たら・たり（と）・たり・たる・たれ・たれ"},
        {word:"まじ", mean:"打消推量・打消意志・不可能・禁止", conn:"終止形(ラ変は連体)", form:"(まじから・まじかり…)/(まじく・まじう…)"},
        {word:"たし", mean:"希望（自己）", conn:"連用形", form:"(たしから・たしかり…)/(〇・たく・たし…)"},
        {word:"ごとし", mean:"比況・例示", conn:"体言・連体形・助詞「の」「が」", form:"〇・ごとく・ごとし・ごとき・〇・〇"}
    ];

    function generateQuiz() {
        const shuffled = [...dataList].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, 15);
        const quizList = document.getElementById('quiz-list');
        quizList.innerHTML = '';

        selected.forEach((item, index) => {
            const row = document.createElement('div');
            row.className = 'quiz-row';
            row.id = `row-${index}`;
            row.innerHTML = `
                <div class="question">${item.word}</div>
                <div class="answers">
                    <div class="answer-item"><span>意味：</span>${item.mean}</div>
                    <div class="answer-item"><span>接続：</span>${item.conn}</div>
                    <div class="answer-item"><span>活用：</span>${item.form}</div>
                </div>
                <button class="toggle-btn" onclick="toggleAnswer(${index})">👁️</button>
            `;
            quizList.appendChild(row);
        });
    }

    function toggleAnswer(index) {
        const row = document.getElementById(`row-${index}`);
        row.classList.toggle('show');
        const btn = row.querySelector('.toggle-btn');
        btn.textContent = row.classList.contains('show') ? '✓' : '👁️';
    }

    // 最初の一回を実行
    generateQuiz();
</script>

</body>
</html>
